[package]
name = "voco-io"
version = "1.9.9"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
base64 = "0.22"
serde_json = "1"
quick-xml = "0.42"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
