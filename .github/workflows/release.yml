name: Release Voco

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 2.0.0 or 2.0.0-rc1)'
        required: true
        type: string
      codename:
        description: 'Release codename (e.g., Abyssal Descent · 深渊下潜)'
        required: false
        type: string
        default: 'Abyssal Descent · 深渊下潜'

jobs:
  generate-release-body:
    name: Generate Release Body
    uses: ./.github/workflows/reusable-release-body.yml
    with:
      version: ${{ github.event.inputs.version }}
      codename: ${{ github.event.inputs.codename }}

  build:
    name: Build
    needs: generate-release-body
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ github.event.inputs.version }}
      upload-artifacts: true
      artifact-retention-days: 30
    secrets: inherit

  release:
    name: Create Release
    needs: [generate-release-body, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: voco-*
          merge-multiple: false

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Collect all files for release
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.sig" \) -exec cp {} release-assets/ \;
          echo "Files to be released:"
          ls -la release-assets/

      - name: Generate checksums
        id: checksums
        run: |
          cd release-assets
          echo "| 文件 / File | SHA256 |" > ../checksums_table.md
          echo "| ----------- | ------ |" >> ../checksums_table.md

          for file in *; do
            if [ -f "$file" ] && [[ "$file" != *.sig ]]; then
              HASH=$(sha256sum "$file" | cut -d' ' -f1)
              echo "| $file | \`$HASH\` |" >> ../checksums_table.md
            fi
          done

          echo "Generated checksums table:"
          cat ../checksums_table.md

      - name: Generate latest.json
        id: generate-updater
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Initialize JSON structure
          cat > latest.json << EOF
          {
            "version": "v${VERSION}",
            "notes": "See the full release notes at https://github.com/${{ github.repository }}/releases/tag/v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
          EOF

          FIRST_PLATFORM=true

          # Function to add platform entry
          add_platform() {
            local platform_key=$1
            local file_path=$2
            local sig_path="${file_path}.sig"

            if [ -f "$file_path" ]; then
              local url="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$(basename "$file_path")"
              local signature=""

              if [ -f "$sig_path" ]; then
                signature=$(cat "$sig_path" | tr -d '\n')
              fi

              if [ "$FIRST_PLATFORM" = true ]; then
                FIRST_PLATFORM=false
              else
                echo "," >> latest.json
              fi

              cat >> latest.json << EOF
              "${platform_key}": {
                "url": "${url}",
                "signature": "${signature}"
              }
          EOF
            fi
          }

          # Windows x86_64 - NSIS
          add_platform "windows-x86_64" "release-assets/Voco_${VERSION}_x64-setup.exe"

          # macOS x86_64
          add_platform "darwin-x86_64" "release-assets/Voco_${VERSION}_x64.app.tar.gz"

          # macOS aarch64
          add_platform "darwin-aarch64" "release-assets/Voco_${VERSION}_aarch64.app.tar.gz"

          # Linux x86_64 - AppImage
          add_platform "linux-x86_64" "release-assets/Voco_${VERSION}_amd64.AppImage"

          # Linux aarch64 - AppImage
          add_platform "linux-aarch64" "release-assets/Voco_${VERSION}_aarch64.AppImage"

          # Close JSON structure
          cat >> latest.json << EOF

            }
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

          # Copy latest.json to release-assets
          cp latest.json release-assets/

      - name: Update release body with checksums
        run: |
          RELEASE_BODY='${{ needs.generate-release-body.outputs.release_body }}'
          CHECKSUMS_TABLE=$(cat checksums_table.md)

          # Replace the checksum table placeholder
          echo "$RELEASE_BODY" | sed '/## 🔐 校验信息/,/---/{/## 🔐 校验信息/!{/---/!d}}' | sed "s/## 🔐 校验信息.*/## 🔐 校验信息 \/ Checksums\n\n$CHECKSUMS_TABLE/" > final_release_body.md

          echo "Final release body:"
          cat final_release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ${{ needs.generate-release-body.outputs.release_title }}
          body_path: final_release_body.md
          draft: true
          prerelease: ${{ needs.generate-release-body.outputs.is_prerelease }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
