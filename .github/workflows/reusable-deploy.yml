name: Deploy Website

on:
    workflow_call:
        inputs:
            environment:
                description: "Environment to deploy to"
                required: false
                type: string
                default: "production"
        secrets:
            VERCEL_TOKEN:
                required: true
            VERCEL_ORG_ID:
                required: true
            VERCEL_PROJECT_ID:
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: pnpm

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.0.8

            - run: pnpm install --frozen-lockfile

            # 1️⃣ 只 build website（Turbo 精准 scope）
            - name: Build Website
              run: pnpm build.website

            # 2️⃣ Deploy (prebuilt)
            - name: Deploy to Vercel
              run: |
                  vercel deploy apps/voco-website/dist
                    ${{ inputs.environment == 'production' && '--prod' || '' }} \
                    --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
